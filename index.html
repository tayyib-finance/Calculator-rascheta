<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f0f1ec">
<title>Авто-фонд · Исламская рассрочка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f0f1ec;--card:#fff;--dark:#2d3a34;--lime:#c8dd5f;
  --text:#1a1f1c;--muted:#7a8079;--line:#e5e6e0;
  --danger:#c94a3f;--green:#5a7522;
}
html,body{background:var(--bg);color:var(--text);font-size:15px;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
  line-height:1.45;-webkit-font-smoothing:antialiased;}
body{padding-bottom:40px;}
.app{max-width:520px;margin:0 auto;padding:16px;}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 0 16px;}
.topbar .logo{width:44px;height:44px;border-radius:12px;background:var(--lime);
  color:var(--dark);display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;}
.topbar .title{font-size:18px;font-weight:800;letter-spacing:-.3px;}
.topbar .sub{font-size:12px;color:var(--muted);}
h1.screen-title{font-size:26px;font-weight:800;letter-spacing:-.5px;
  margin:8px 0 4px;}
p.screen-sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
.card{background:var(--card);border-radius:20px;padding:18px;
  margin-bottom:12px;}
.card-label{color:var(--muted);font-size:12px;text-transform:uppercase;
  letter-spacing:.4px;font-weight:600;margin-bottom:10px;}
.field{margin-bottom:14px;}
.field:last-child{margin-bottom:0;}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;
  font-weight:500;}
input{width:100%;padding:14px 16px;border:1px solid var(--line);
  border-radius:12px;font-size:15px;font-family:inherit;background:var(--card);
  color:var(--text);font-weight:600;}
input:focus{outline:none;border-color:var(--dark);}
.btn{display:inline-flex;align-items:center;justify-content:center;
  padding:14px 20px;border-radius:14px;border:none;font-size:15px;
  font-weight:700;font-family:inherit;cursor:pointer;width:100%;}
.btn-dark{background:var(--dark);color:#fff;}
.btn-dark:active{opacity:.85;}
.results{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px;}
@media(min-width:600px){
  .results{grid-template-columns:1fr 1fr;}
}
.result-card{background:var(--card);border-radius:20px;padding:18px;
  border:2px solid transparent;}
.result-card.win{border-color:var(--lime);}
.result-card h3{font-size:14px;font-weight:700;margin-bottom:4px;}
.result-card .desc{font-size:12px;color:var(--muted);margin-bottom:14px;
  line-height:1.4;}
.metric{font-size:26px;font-weight:800;letter-spacing:-.5px;
  margin-bottom:4px;}
.metric.green{color:var(--green);}
.metric.dark{color:var(--dark);}
.metric-label{font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.3px;font-weight:600;margin-bottom:14px;}
.row-line{display:flex;justify-content:space-between;padding:8px 0;
  border-top:1px solid var(--line);font-size:13px;}
.row-line:first-of-type{border-top:none;padding-top:0;}
.row-line .k{color:var(--muted);}
.row-line .v{font-weight:700;}
.table-card{background:var(--card);border-radius:20px;padding:18px;
  margin-top:16px;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);}
th{font-size:11px;color:var(--muted);text-transform:uppercase;
  font-weight:700;letter-spacing:.3px;}
td:first-child{color:var(--muted);font-weight:500;}
td:last-child,td:nth-child(3){font-weight:700;text-align:right;}
tr:last-child td{border-bottom:none;}
.badge-win{display:inline-block;background:var(--lime);color:var(--dark);
  font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;
  margin-left:6px;letter-spacing:.3px;}
.info-note{background:#f8fafc;border-radius:12px;padding:12px;
  font-size:12px;color:var(--muted);line-height:1.5;margin-top:16px;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="logo">Σ</div>
    <div>
      <div class="title">Авто-фонд</div>
      <div class="sub">Калькулятор исламской рассрочки</div>
    </div>
  </div>

  <h1 class="screen-title">Сравнение сроков</h1>
  <p class="screen-sub">5 месяцев × 2 круга vs 10 месяцев × 1 круг</p>

  <div class="card">
    <div class="card-label">Параметры фонда</div>
    <div class="field">
      <label>Стартовый капитал, ₽</label>
      <input type="number" id="capital" value="2000000" step="100000">
    </div>
    <div class="field">
      <label>Цена закупки одного авто, ₽</label>
      <input type="number" id="carPrice" value="200000" step="10000">
    </div>
    <div class="field">
      <label>Первоначальный взнос с клиента, ₽</label>
      <input type="number" id="down" value="50000" step="5000">
    </div>
    <div class="field">
      <label>Ежемесячная наценка, %</label>
      <input type="number" id="pct" value="5" step="0.5">
    </div>
  </div>

  <button class="btn btn-dark" onclick="calc()">Рассчитать</button>

  <div id="results" class="results"></div>
  <div id="table"></div>

</div>

<script>
const fmt = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';

function cycle5(capital, carPrice, down, pctMonth){
  const net = carPrice - down;
  if(net <= 0) return {cars:0, endCapital:capital, monthly:0, totalDebt:0};
  let cash = capital;
  let cars = 0;
  while(cash >= carPrice){
    cash -= carPrice;
    cash += down;
    cars++;
  }
  while(cash >= net){
    cash -= net;
    cars++;
  }
  const pct5 = pctMonth * 5 / 100;
  const totalDebtPerCar = net * (1 + pct5);
  const monthlyPay = totalDebtPerCar / 5;
  const totalFromAll = cars * totalDebtPerCar;
  const endCapital = cash + totalFromAll;
  return {cars, endCapital, monthly:monthlyPay, totalDebt:totalDebtPerCar};
}

function cycle10(capital, carPrice, down, pctMonth, startCars){
  const net = carPrice - down;
  if(net <= 0) return {cars:0, endCapital:capital, monthly:0, totalDebt:0};
  let cash = capital - startCars * carPrice + startCars * down;
  const pct10 = pctMonth * 10 / 100;
  const totalDebtPerCar = net * (1 + pct10);
  const monthlyPay = totalDebtPerCar / 10;
  const totalFromInitial = startCars * totalDebtPerCar;

  let extraCars = 0;
  for(let m=1; m<=10; m++){
    cash += startCars * monthlyPay + extraCars * monthlyPay;
    let buy = Math.floor(cash / net);
    if(buy > 0){
      cash -= buy * net;
      extraCars += buy;
    }
  }
  const extraPayments = extraCars * monthlyPay * 5;
  const endCapital = cash + totalFromInitial + extraPayments;
  return {cars:startCars + extraCars, endCapital, monthly:monthlyPay, totalDebt:totalDebtPerCar};
}

function calc(){
  const capital = +document.getElementById('capital').value || 0;
  const carPrice = +document.getElementById('carPrice').value || 0;
  const down = +document.getElementById('down').value || 0;
  const pct = +document.getElementById('pct').value || 0;
  const net = carPrice - down;

  if(net <= 0){
    document.getElementById('results').innerHTML =
      '<div class="card" style="color:#c94a3f">Взнос не может быть больше цены авто</div>';
    document.getElementById('table').innerHTML='';
    return;
  }

  const k1 = cycle5(capital, carPrice, down, pct);
  const k2 = cycle5(k1.endCapital, carPrice, down, pct);
  const profit5 = k2.endCapital - capital;
  const r10 = cycle10(capital, carPrice, down, pct, k1.cars);
  const profit10 = r10.endCapital - capital;
  const win5 = profit5 >= profit10;

  document.getElementById('results').innerHTML = `
    <div class="result-card ${win5?'win':''}">
      <h3>🟢 Срок 5 месяцев ${win5?'<span class="badge-win">ЛУЧШЕ</span>':''}</h3>
      <div class="desc">Два круга по 5 месяцев с реинвестированием</div>
      <div class="metric green">${fmt(profit5)}</div>
      <div class="metric-label">Чистая прибыль за 10 мес</div>
      <div class="row-line"><span class="k">Итоговый капитал</span><span class="v">${fmt(k2.endCapital)}</span></div>
      <div class="row-line"><span class="k">Круг 1: машин</span><span class="v">${k1.cars} шт</span></div>
      <div class="row-line"><span class="k">Платёж (круг 1)</span><span class="v">${fmt(k1.monthly)}/мес</span></div>
      <div class="row-line"><span class="k">Круг 2: машин</span><span class="v">${k2.cars} шт</span></div>
      <div class="row-line"><span class="k">Платёж (круг 2)</span><span class="v">${fmt(k2.monthly)}/мес</span></div>
    </div>

    <div class="result-card ${!win5?'win':''}">
      <h3>⏱️ Срок 10 месяцев ${!win5?'<span class="badge-win">ЛУЧШЕ</span>':''}</h3>
      <div class="desc">Один круг с реинвестированием потока</div>
      <div class="metric dark">${fmt(profit10)}</div>
      <div class="metric-label">Чистая прибыль за 10 мес</div>
      <div class="row-line"><span class="k">Итоговый капитал</span><span class="v">${fmt(r10.endCapital)}</span></div>
      <div class="row-line"><span class="k">Машин в работе</span><span class="v">${r10.cars} шт</span></div>
      <div class="row-line"><span class="k">Платёж с 1 авто</span><span class="v">${fmt(r10.monthly)}/мес</span></div>
      <div class="row-line"><span class="k">Долг с 1 авто</span><span class="v">${fmt(r10.totalDebt)}</span></div>
    </div>
  `;

  const diff = profit5 - profit10;
  const winner = diff > 0 ? '5 месяцев (2 круга)' : '10 месяцев (1 круг)';

  document.getElementById('table').innerHTML = `
    <div class="table-card">
      <div class="card-label">📊 Прямое сравнение</div>
      <table>
        <thead>
          <tr><th>Параметр</th><th>5 мес × 2</th><th>10 мес × 1</th></tr>
        </thead>
        <tbody>
          <tr><td>Стартовых машин</td><td>${k1.cars}</td><td>${k1.cars}</td></tr>
          <tr><td>Всего машин за период</td><td>${k1.cars+k2.cars}</td><td>${r10.cars}</td></tr>
          <tr><td>Наценка на 1 авто</td><td>${fmt(net*pct*5/100)}</td><td>${fmt(net*pct*10/100)}</td></tr>
          <tr><td>Ежемес. платёж с 1 авто</td><td>${fmt(k1.monthly)}</td><td>${fmt(r10.monthly)}</td></tr>
          <tr><td>Чистая прибыль</td><td>${fmt(profit5)}</td><td>${fmt(profit10)}</td></tr>
          <tr><td>Итоговый капитал</td><td>${fmt(k2.endCapital)}</td><td>${fmt(r10.endCapital)}</td></tr>
        </tbody>
      </table>
    </div>
    <div class="info-note">
      🏆 <b>Победитель: ${winner}</b><br>
      Разница в прибыли: <b>${fmt(Math.abs(diff))}</b><br><br>
      <b>Важно помнить:</b> короткий срок (5 мес) требует больше клиентов и постоянной работы с потоком. Долгий (10 мес) проще в управлении, но деньги заморожены дольше.
    </div>
  `;
}

window.addEventListener('DOMContentLoaded', calc);
</script>
</body>
</html>
